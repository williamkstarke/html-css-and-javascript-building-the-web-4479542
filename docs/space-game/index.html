<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Space Game</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .game-shell {
      width: min(100vw, 1040px);
      padding: 12px;
      box-sizing: border-box;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      border: 1px solid #d3d3d3;
      background: #000;
      touch-action: none;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      align-items: stretch;
    }

    .stick-pad,
    .action-pad {
      flex: 1;
      min-height: 160px;
      border-radius: 22px;
      background: linear-gradient(145deg, #1f2937, #111827);
      border: 2px solid #4b5563;
      position: relative;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    .stick-pad {
      position: relative;
      background: radial-gradient(circle at center, #374151 0%, #111827 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .stick-pad .stick-knob {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(145deg, #60a5fa, #2563eb);
      border: 3px solid #dbeafe;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      position: absolute;
      left: calc(50% - 32px);
      top: calc(50% - 32px);
      transition: transform 0.08s ease;
    }

    .stick-pad .label {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #d1d5db;
    }

    .action-pad {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: stretch;
      justify-content: center;
      padding: 12px;
      width: 140px;
      box-sizing: border-box;
    }

    .action-pad button {
      width: 100%;
      min-height: 76px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(145deg, #ef4444, #b91c1c);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      touch-action: none;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.25);
    }

    .action-pad .start-btn {
      background: linear-gradient(145deg, #16a34a, #15803d);
      font-size: 16px;
      min-height: 56px;
    }

    .action-pad button:active {
      transform: scale(0.98);
    }

    @media (max-width: 700px) {
      .controls {
        flex-direction: column;
      }

      .stick-pad,
      .action-pad {
        min-height: 140px;
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <canvas id="myCanvas" width="1024" height="768">
      Your browser does not support the HTML5 canvas tag.
    </canvas>

    <div class="controls" aria-label="Game controls">
      <div class="stick-pad" id="movementPad" aria-label="Movement pad">
        <div class="stick-knob" id="stickKnob"></div>
        <div class="label">Move</div>
      </div>
      <div class="action-pad" aria-label="Action pad">
        <button type="button" class="fire" data-action="fire">Fire</button>
        <button type="button" class="start-btn" data-action="start">Start</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
