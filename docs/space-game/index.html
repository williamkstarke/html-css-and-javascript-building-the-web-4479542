<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Space Game</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .game-shell {
      width: min(100vw, 1040px);
      padding: 12px;
      box-sizing: border-box;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      border: 1px solid #d3d3d3;
      background: #000;
      touch-action: none;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      align-items: stretch;
    }

    .stick-pad,
    .action-pad {
      flex: 1;
      min-height: 140px;
      border-radius: 18px;
      background: linear-gradient(145deg, #1f2937, #111827);
      border: 2px solid #4b5563;
      position: relative;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    .stick-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 8px;
      gap: 8px;
    }

    .stick-pad button,
    .action-pad button {
      border: 0;
      border-radius: 12px;
      background: #2a7fff;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      touch-action: none;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.2);
    }

    .stick-pad button:active,
    .action-pad button:active {
      transform: scale(0.98);
    }

    .stick-pad .up { grid-column: 2; grid-row: 1; }
    .stick-pad .left { grid-column: 1; grid-row: 2; }
    .stick-pad .right { grid-column: 3; grid-row: 2; }
    .stick-pad .down { grid-column: 2; grid-row: 3; }
    .stick-pad .center { grid-column: 2; grid-row: 2; background: #374151; }

    .action-pad {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 8px;
    }

    .action-pad .fire { background: #dc2626; grid-column: span 2; }
    .action-pad .start { background: #16a34a; grid-column: span 2; }

    @media (max-width: 700px) {
      .controls {
        flex-direction: column;
      }

      .stick-pad,
      .action-pad {
        min-height: 120px;
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <canvas id="myCanvas" width="1024" height="768">
      Your browser does not support the HTML5 canvas tag.
    </canvas>

    <div class="controls" aria-label="Game controls">
      <div class="stick-pad" aria-label="Movement pad">
        <button type="button" class="up" data-action="up">▲</button>
        <button type="button" class="left" data-action="left">◀</button>
        <button type="button" class="center" data-action="neutral">●</button>
        <button type="button" class="right" data-action="right">▶</button>
        <button type="button" class="down" data-action="down">▼</button>
      </div>
      <div class="action-pad" aria-label="Action pad">
        <button type="button" class="fire" data-action="fire">Fire</button>
        <button type="button" class="start" data-action="start">Start</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
